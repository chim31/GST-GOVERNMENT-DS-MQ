<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-display)}
  .main{flex:1;background:var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:var(--white)}
  .fleur{font-family:var(--font-serif);font-size:150px;line-height:1;color:var(--white)}
  .name{font-family:var(--font-display);font-size:120px;line-height:0.84;text-align:center;letter-spacing:0.02em;text-transform:uppercase}
  .name b{display:block;color:var(--white)}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip span{flex:1}
</style></head>
<body>
  <div class="tile">
    <div class="main">
      <div class="fleur">&#9884;</div>
      <div class="name"><b>Groupe Scout</b><b>Tonnerre</b></div>
    </div>
    <div class="strip">
      <span style="background:#C42621"></span>
      <span style="background:#0C7873"></span>
      <span style="background:#06605E"></span>
      <span style="background:#063f3e"></span>
    </div>
  </div>
</body></html>
