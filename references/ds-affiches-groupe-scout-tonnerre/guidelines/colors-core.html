<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0;font-family:var(--font-mono)}
 .row{display:flex;height:210px}
 .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
 .n{font-size:14px;letter-spacing:.04em;font-weight:600}
 .h{font-size:12px;opacity:.75;margin-top:3px}
 .light{color:#fff}.dark{color:var(--ink)}
</style></head><body>
<div class="row">
  <div class="sw light" style="background:var(--teal)"><div class="n">Teal</div><div class="h">#0C7873 · --teal</div></div>
  <div class="sw light" style="background:var(--red)"><div class="n">Rouge accent</div><div class="h">#C42621 · --red</div></div>
  <div class="sw dark" style="background:var(--cream);border-right:1px solid var(--line-on-white)"><div class="n">Écru</div><div class="h">#F4F4F2 · --cream</div></div>
  <div class="sw light" style="background:var(--ink)"><div class="n">Encre</div><div class="h">#141414 · --ink</div></div>
</div>
</body></html>
