<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0;background:var(--cream);font-family:var(--font-mono)}
 .wrap{padding:26px 30px}
 .hero{display:flex;align-items:center;gap:22px;padding-bottom:22px;border-bottom:1px solid var(--line-on-white);margin-bottom:22px}
 .hero img{height:104px;width:auto}
 .htxt .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-40)}
 .htxt .n{font-family:var(--font-display);font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);margin-top:6px}
 .grid{display:flex;flex-wrap:wrap;gap:20px 26px;align-items:flex-start}
 .item{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px}
 .item.wide{width:200px}
 .item img{max-width:100%;height:56px;width:auto;object-fit:contain}
 .item span{font-size:10px;letter-spacing:.06em;color:var(--ink-70);text-align:center;line-height:1.3}
</style></head><body><div class="wrap">
 <div class="hero">
   <img src="../assets/logos/groupe-scout-tonnerre.jpeg" alt="Groupe Scout Tonnerre">
   <div class="htxt"><div class="k">Logo officiel</div><div class="n">Groupe Scout Tonnerre<br>District Golfe</div></div>
 </div>
 <div class="grid">
   <div class="item wide"><img src="../assets/logos/world-scouting-wordmark.jpeg"><span>World Scouting</span></div>
   <div class="item"><img src="../assets/logos/wosm-emblem-purple.jpeg"><span>WOSM emblème</span></div>
   <div class="item"><img src="../assets/logos/wosm-patch.jpeg"><span>WOSM patch</span></div>
   <div class="item"><img src="../assets/logos/wosm-dove-emblem.jpeg"><span>Colombe scoute</span></div>
   <div class="item"><img src="../assets/logos/africa-scout-region.jpeg"><span>Région Afrique</span></div>
   <div class="item"><img src="../assets/logos/africa-united-camp.jpeg"><span>African United Camp</span></div>
   <div class="item"><img src="../assets/logos/safe-from-harm.jpeg"><span>Safe From Harm</span></div>
   <div class="item"><img src="../assets/logos/digitalise-youth.jpeg"><span>Digitalise Youth</span></div>
   <div class="item wide"><img src="../assets/logos/digital-democracy-initiative.jpeg"><span>Digital Democracy</span></div>
 </div>
</div></body></html>
