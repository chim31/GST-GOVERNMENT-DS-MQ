<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0;font-family:var(--font-mono)}
 .row{display:flex;height:150px}
 .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
 .n{font-size:13px;font-weight:600}.h{font-size:11px;opacity:.75;margin-top:2px}
 .light{color:#fff}.dark{color:var(--ink)}
</style></head><body>
<div class="row">
  <div class="sw light" style="background:var(--ink)"><div class="n">--ink</div><div class="h">#141414</div></div>
  <div class="sw light" style="background:var(--ink-70)"><div class="n">--ink-70</div><div class="h">#4A4A4A</div></div>
  <div class="sw light" style="background:var(--ink-40)"><div class="n">--ink-40</div><div class="h">#8A8A8A</div></div>
  <div class="sw dark" style="background:var(--cream)"><div class="n">--cream</div><div class="h">#F4F4F2</div></div>
  <div class="sw dark" style="background:var(--white);border-left:1px solid var(--line-on-white)"><div class="n">--white</div><div class="h">#FFFFFF</div></div>
</div>
</body></html>
