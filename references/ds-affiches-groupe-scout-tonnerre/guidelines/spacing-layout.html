<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#cfd3d2;display:flex;justify-content:center;align-items:center;height:300px}
 .poster{position:relative;width:260px;height:260px;background:var(--teal-deep);padding:14px;box-sizing:border-box;font-family:var(--font-mono)}
 .panel{position:relative;width:100%;height:100%;background:#fff;box-sizing:border-box}
 .cap{position:absolute;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--red);padding:2px 5px}
 .c1{top:2px;left:2px}
 .c2{bottom:16px;left:16px;color:var(--ink);background:var(--cream)}
 .rail{position:absolute;top:0;right:0;width:14px;height:100%;background:rgba(255,255,255,.14)}
</style></head><body>
<div class="poster">
  <div class="rail"></div>
  <div class="panel"><span class="cap c2">panneau · 68px</span></div>
  <span class="cap c1">cadre · 34px</span>
</div>
</body></html>
