<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--white)}.wrap{padding:24px 32px;font-family:var(--font-mono)}
 table{border-collapse:collapse;width:100%}
 td{padding:7px 0;font-size:14px;color:var(--ink);border-bottom:1px solid var(--line-on-white)}
 td.tok{color:var(--ink-40);letter-spacing:.04em}
 td.px{text-align:right;color:var(--teal);font-weight:600}
</style></head><body><div class="wrap"><table>
 <tr><td class="tok">--fs-display-2xl</td><td>Compte à rebours</td><td class="px">168px</td></tr>

 <tr><td class="tok">--fs-display-lg</td><td>Titre secondaire</td><td class="px">84px</td></tr>
 <tr><td class="tok">--fs-serif-xl</td><td>Titre serif</td><td class="px">58px</td></tr>
 <tr><td class="tok">--fs-body</td><td>Texte courant</td><td class="px">29px</td></tr>
 <tr><td class="tok">--fs-mono</td><td>Valeur pratique</td><td class="px">22px</td></tr>
 <tr><td class="tok">--fs-tag</td><td>Marqueur de grille</td><td class="px">13px</td></tr>
</table></div></body></html>
