<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Bonne chance à tous pour vos examens</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:#cfd3d2;display:flex;justify-content:center}#root{width:1080px;height:1080px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.GroupeScoutTonnerreDesignSystem_ad7474;
const { PosterFrame, HeaderBand, SocialRail, PartnerRow, GreetingBlock, DataTag } = NS;

function Poster(){
  return (
    <PosterFrame
      tone="cream"
      header={<HeaderBand submention="vous souhaite" />}
      rail={<SocialRail />}
      footer={<PartnerRow badgesSrc="../../assets/partner-badges.png" />}
    >
      <div style={{ display:"flex", flexDirection:"column", gap:"var(--space-6)", flex:1, justifyContent:"center", alignItems:"center" }}>
        <GreetingBlock
          lead="Bonne chance à tous pour vos"
          highlight="Examens"
          highlightColor="red"
          message="Travaillez avec confiance, réussissez avec fierté !"
        />
        <div style={{ border:"var(--border-weight) solid var(--teal)", padding:"var(--space-3) var(--space-5)" }}>
          <DataTag label="On croit en vous" />
        </div>
      </div>
    </PosterFrame>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Poster/>);
</script>
</body></html>
